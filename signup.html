{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block main_class %}login-wrap{% endblock %}

{% block content %}
<div class="login-card">
  <div class="login-head">
    <img src="{{ url_for('static', filename='img/favicon.svg') }}" alt="" width="40" height="40">
    <h1>회원가입</h1>
    <p>가입 후 관리자가 승인하면 로그인할 수 있습니다.</p>
  </div>

  <form method="post" action="{{ url_for('signup') }}" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>아이디
      <input name="username" value="{{ form.get('username', '') }}" maxlength="50" autocomplete="username" required autofocus>
    </label>
    <label>이름
      <input name="name" value="{{ form.get('name', '') }}" maxlength="50" autocomplete="name" required>
    </label>
    <label>이메일
      <input name="email" type="email" value="{{ form.get('email', '') }}" maxlength="255" placeholder="보안 알림을 받을 주소" autocomplete="email" required>
    </label>
    <label>소속팀
      <select name="team" class="select" required>
        <option value="" disabled {{ 'selected' if not form.get('team') }}>팀을 고르세요</option>
        {% for key, label in TEAMS.items() %}
          <option value="{{ key }}" {{ 'selected' if form.get('team') == key }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>비밀번호
      <input name="password" type="password" minlength="8" placeholder="8자 이상" autocomplete="new-password" required>
    </label>
    <label>비밀번호 확인
      <input name="password2" type="password" minlength="8" autocomplete="new-password" required>
    </label>
    <button class="btn btn-primary btn-block">가입 신청</button>
  </form>

  <p class="login-alt">이미 계정이 있나요? <a href="{{ url_for('index') }}">로그인</a></p>
</div>
{% endblock %}
